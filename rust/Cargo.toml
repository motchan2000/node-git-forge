[package]
name = "forge"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A standalone GitHub-compatible git forge: git smart HTTP, REST v3, GraphQL v4 and MCP over one in-memory store, on the Rust standard library alone"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false
strip = true
